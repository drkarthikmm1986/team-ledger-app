<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Team Ledger · Owner</title>
<link rel="icon" href="app/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0b1416;--card:#132225;--card2:#17292c;--line:#22383b;--text:#e9f3f1;--muted:#9db3b0;--brand:#2cc7b4;--in:#3fd68a;--out:#ff6b7f;--gold:#f5b301;--font:"Inter","Segoe UI",system-ui,-apple-system,"Noto Sans Tamil",Roboto,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f3f6f5;--card:#fff;--card2:#f7faf9;--line:#dce5e2;--text:#0f1c1b;--muted:#5d6f6c;--brand:#0e7c74;--in:#13914f;--out:#d8344a;color-scheme:light}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--font)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header img{width:44px;height:44px;border-radius:13px}
header h1{margin:0;font-size:22px;flex:1}header h1 small{display:block;font-size:13px;color:var(--muted);font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
.btn{height:46px;padding:0 18px;border-radius:13px;border:0;background:var(--brand);color:#04211e;font-weight:750;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi small{display:block;color:var(--muted);font-weight:650;font-size:13px}
.kpi b{display:block;font-size:30px;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
h2{font-size:17px;margin:28px 2px 10px}
.row2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:8px}
.bars i{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars i:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#000;color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap;font-style:normal}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.split div{display:flex;align-items:center;gap:10px;margin:8px 0}.split span{width:110px;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split em{flex:1;height:10px;border-radius:5px;background:var(--card2);overflow:hidden}.split em i{display:block;height:100%;background:var(--brand)}
.split b{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.review{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px}.review:first-child{border-top:0}
.review .st{color:var(--gold);letter-spacing:1px;white-space:nowrap}.review p{margin:4px 0 0}.review small{color:var(--muted)}
.review.hid{opacity:.45}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}.tbl td,.tbl th{padding:9px 6px;border-top:1px solid var(--line);text-align:left}.tbl th{color:var(--muted);font-size:12.5px;border-top:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:0 12px;width:100%}
.form{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:12px}.form .full{grid-column:1/-1}
.login{max-width:380px;margin:12vh auto;display:grid;gap:12px}
.msg{padding:12px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.err{color:var(--out)}
.note{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main id="m"></main>
<script>
(function(){
'use strict';
const URL_ = 'https://mvgzthdiydlhwxpzqnlq.supabase.co', KEY = 'sb_publishable_FxRTDOsi99f8eigIGNEICA_yq7DED9N';
const $ = s => document.querySelector(s), m = $('#m');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('en-IN'), rs = p => '₹' + new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}).format((p||0)/100);
let token = sessionStorage.getItem('tl-owner-token') || '';
async function call(path, opt){
  opt = opt || {};
  const r = await fetch(URL_ + path, Object.assign({}, opt, {headers: Object.assign({apikey: KEY, Authorization: 'Bearer ' + (token || KEY), 'Content-Type': 'application/json'}, opt.headers || {})}));
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch(e){}
  if (r.status === 401) { token = ''; sessionStorage.removeItem('tl-owner-token'); login('உள்நுழைவு காலாவதியானது. மீண்டும் உள்நுழையவும். / Session expired.'); throw Error('401'); }
  if (!r.ok) throw Error((j && (j.message || j.error_description || j.msg)) || ('HTTP ' + r.status));
  return j;
}
function head(){ return `<header><img src="app/icon.svg" alt=""><h1>Team Ledger · Owner<small>உரிமையாளர் கட்டுப்பாட்டு பலகை · Owner dashboard</small></h1>${token ? '<button class="btn ghost" id="out">வெளியேறு</button>' : ''}</header>`; }
function login(msg){
  m.innerHTML = head() + `<form class="login card" id="lf"><b>உரிமையாளர் உள்நுழைவு / Owner sign in</b>
    <input class="input" id="em" type="email" autocomplete="username" placeholder="Email" required>
    <input class="input" id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn">உள்நுழை / Sign in</button>${msg ? `<div class="msg err">${esc(msg)}</div>` : ''}
    <p class="note">Team Ledger ஆப்பில் உருவாக்கிய அதே login. உரிமையாளர் email மட்டுமே எண்களைப் பார்க்க முடியும்.<br>Use the same login you created for Team Ledger. Only the owner email can see the numbers.</p></form>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    try {
      const r = await fetch(URL_ + '/auth/v1/token?grant_type=password', {method:'POST', headers:{apikey:KEY,'Content-Type':'application/json'}, body: JSON.stringify({email: $('#em').value.trim(), password: $('#pw').value})});
      const j = await r.json(); if (!r.ok) throw Error(j.error_description || j.msg || 'Sign in failed');
      token = j.access_token; sessionStorage.setItem('tl-owner-token', token); load();
    } catch(err){ login(err.message === 'Failed to fetch' ? 'இணையம் இல்லை / No internet' : err.message); }
  };
}
function bars(list, key, label){
  if (!list || !list.length) return '<p class="note">இன்னும் தரவு இல்லை / No data yet</p>';
  const days = []; const map = new Map(list.map(x => [x.d, x.n]));
  for (let i = 29; i >= 0; i--){ const d = new Date(); d.setDate(d.getDate() - i); const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); days.push([k, map.get(k) || 0]); }
  const max = Math.max(1, ...days.map(x => x[1]));
  return `<div class="bars">${days.map(([d,n]) => `<i style="height:${n/max*100}%" data-t="${d}: ${n}"></i>`).join('')}</div><div class="axis"><span>${days[0][0].slice(5)}</span><span>${label}</span><span>${days[29][0].slice(5)}</span></div>`;
}
function split(obj){
  const e = Object.entries(obj || {}).sort((a,b) => b[1]-a[1]); if (!e.length) return '<p class="note">—</p>';
  const tot = e.reduce((n,x) => n + x[1], 0);
  return `<div class="split">${e.map(([k,v]) => `<div><span>${esc(k || '—')}</span><em><i style="width:${v/tot*100}%"></i></em><b>${nf.format(v)}</b></div>`).join('')}</div>`;
}
const stars = n => '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
async function load(){
  m.innerHTML = head() + '<div class="msg">ஏற்றுகிறது… / Loading…</div>';
  let s, reviews, revenue;
  try {
    [s, reviews, revenue] = await Promise.all([
      call('/rest/v1/rpc/tl_owner_summary', {method:'POST', body:'{}'}),
      call('/rest/v1/tl_reviews?select=*&order=created_at.desc&limit=300'),
      call('/rest/v1/tl_revenue?select=*&order=day.desc&limit=200')
    ]);
  } catch(e){
    if (e.message === '401') return;
    m.innerHTML = head() + `<div class="msg err">${esc(e.message)}</div><p class="note">முதல் முறை என்றால்: Supabase → SQL Editor-ல் <b>owner-setup.sql</b>-ஐ ஒருமுறை run செய்யவும். உரிமையாளர் email-ஆல் உள்நுழைந்திருக்க வேண்டும்.<br>First time? Run <b>owner-setup.sql</b> once in Supabase → SQL Editor, and sign in with the owner email.</p>`;
    head && $('#out') && ($('#out').onclick = logout); return;
  }
  const dist = s.stars_dist || {};
  m.innerHTML = head() + `
    <div class="grid">
      <div class="card kpi"><small>மொத்த பயனர்கள் · Users</small><b>${nf.format(s.users_total||0)}</b><span>+${nf.format(s.new_7||0)} இந்த வாரம் / this week</span></div>
      <div class="card kpi"><small>இன்று Active · Today</small><b>${nf.format(s.active_today||0)}</b><span>7 நாள்: ${nf.format(s.active_7||0)} · 30 நாள்: ${nf.format(s.active_30||0)}</span></div>
      <div class="card kpi"><small>Downloads</small><b>${nf.format(s.downloads_total||0)}</b><span>+${nf.format(s.downloads_7||0)} இந்த வாரம் / 7 days</span></div>
      <div class="card kpi"><small>Reviews</small><b>${s.stars_avg ? s.stars_avg + ' ★' : '—'}</b><span>${nf.format(s.reviews_total||0)} மதிப்பீடுகள் / ratings</span></div>
      <div class="card kpi"><small>வருமானம் · Revenue</small><b>${rs(s.revenue_total)}</b><span>இந்த மாதம் / this month: ${rs(s.revenue_month)}</span></div>
    </div>
    <div class="row2" style="margin-top:12px">
      <div class="card"><b>தினசரி Active பயனர்கள் · Daily active (30 days)</b>${bars(s.daily_active, 'n', 'Active')}</div>
      <div class="card"><b>தினசரி Downloads · Daily downloads (30 days)</b>${bars(s.daily_downloads, 'n', 'Downloads')}</div>
    </div>
    <div class="row2" style="margin-top:12px">
      <div class="card"><b>Platform</b>${split(s.by_platform)}</div>
      <div class="card"><b>Version</b>${split(s.by_version)}</div>
      <div class="card"><b>மொழி · Language</b>${split(s.by_lang)}<p class="note">நிறுவப்பட்டது (Home screen / APK): ${nf.format(s.installed||0)}</p></div>
    </div>
    <h2>Reviews · மதிப்பீடுகள்</h2>
    <div class="card">
      <div class="split">${[5,4,3,2,1].map(n => `<div><span style="color:var(--gold)">${stars(n)}</span><em><i style="width:${(dist[n]||0)/Math.max(1,s.reviews_total||0)*100}%;background:var(--gold)"></i></em><b>${dist[n]||0}</b></div>`).join('')}</div>
      ${(reviews||[]).length ? reviews.map(r => `<div class="review ${r.hidden?'hid':''}"><div style="flex:1"><span class="st">${stars(r.stars)}</span> <small>${esc(r.name||'—')} · ${esc(r.platform)} · v${esc(r.version)} · ${new Date(r.created_at).toLocaleString('en-IN')}</small>${r.text?`<p>${esc(r.text)}</p>`:''}</div><button class="btn ghost" data-hide="${r.id}" data-v="${!r.hidden}">${r.hidden?'காட்டு / Show':'மறை / Hide'}</button></div>`).join('') : '<p class="note">இன்னும் review இல்லை. ஆப்பில் மேலும் → மதிப்பீடு வழியாக பயனர்கள் அனுப்புவார்கள். / No reviews yet.</p>'}
      <p class="note">“மறை” = இணையதளத்தில் காட்டாது (spam-க்கு மட்டும்). / Hide removes a review from the public website.</p>
    </div>
    <h2>வருமானம் · Revenue</h2>
    <div class="card">
      <p class="note" style="margin-top:0">ஆப் இப்போது இலவசம், பணம் வசூலிக்கும் வசதி இல்லை. விளம்பரம், subscription, சேவை கட்டணம் போன்ற வருமானத்தை இங்கே சேர்க்கவும். / The app is free and has no payment system yet. Record any income here.</p>
      <table class="tbl"><thead><tr><th>தேதி</th><th>மூலம் / Source</th><th>குறிப்பு</th><th class="r">தொகை</th><th></th></tr></thead><tbody>
      ${(revenue||[]).map(r => `<tr><td>${esc(r.day)}</td><td>${esc(r.source)}</td><td>${esc(r.note)}</td><td class="r">${rs(r.amount_paise)}</td><td class="r"><button class="btn ghost" style="height:34px;padding:0 10px" data-del="${r.id}">✕</button></td></tr>`).join('') || '<tr><td colspan="5" class="note">—</td></tr>'}
      </tbody></table>
      <form class="form" id="rf"><input class="input" id="rd" type="date" required><input class="input" id="ra" type="number" step="0.01" placeholder="₹ தொகை / amount" required>
        <input class="input" id="rsrc" placeholder="மூலம் / source (Ads, Plan…)" maxlength="60"><input class="input" id="rn" placeholder="குறிப்பு / note" maxlength="300">
        <button class="btn full">+ வருமானம் சேர் / Add revenue</button></form>
    </div>
    <p class="note" style="margin-top:22px">எண்கள் உண்மையான பயன்பாட்டிலிருந்து மட்டும் வருகின்றன: ஆப் தினமும் ஒருமுறை பெயரில்லா “திறக்கப்பட்டது” என்று அனுப்பும் (பயனர் நிறுத்தலாம்). கணக்கு விவரங்கள் எதுவும் வருவதில்லை. Android APK-ல் இணைய அனுமதி இல்லாததால் Android ஆப் பயனர்கள் Downloads எண்ணிக்கையில் மட்டும் வருவார்கள்.<br>
    Numbers are real usage only: the web app sends one anonymous “opened today” signal (users can turn it off). No ledger data is ever sent. The Android APK has no internet permission, so Android app users are counted through downloads.</p>`;
  { const d = new Date(); $('#rd').value = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  $('#out').onclick = logout;
  m.onclick = async e => {
    const h = e.target.closest('[data-hide]'), d = e.target.closest('[data-del]');
    if (h) { await call('/rest/v1/tl_reviews?id=eq.' + h.dataset.hide, {method:'PATCH', body: JSON.stringify({hidden: h.dataset.v === 'true'})}); load(); }
    if (d && confirm('Delete?')) { await call('/rest/v1/tl_revenue?id=eq.' + d.dataset.del, {method:'DELETE'}); load(); }
  };
  $('#rf').onsubmit = async e => {
    e.preventDefault();
    await call('/rest/v1/tl_revenue', {method:'POST', headers:{Prefer:'return=minimal'}, body: JSON.stringify({day: $('#rd').value, amount_paise: Math.round(Number($('#ra').value)*100), source: $('#rsrc').value.trim(), note: $('#rn').value.trim()})});
    load();
  };
}
function logout(){ token = ''; sessionStorage.removeItem('tl-owner-token'); login(); }
token ? load() : login();
})();
</script>
</body>
</html>
